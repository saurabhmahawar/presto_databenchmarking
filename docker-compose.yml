# =============================================================================
# Presto Cluster with Dedicated Metastore
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL — Dedicated Metastore Database
  # ---------------------------------------------------------------------------
  metastore-db-presto:
    image: postgres:15
    container_name: metastore-db-presto
    hostname: metastore-db-presto
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_password
    volumes:
      - metastore-db-data-presto:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - presto-network

  # ---------------------------------------------------------------------------
  # 2. Hive Metastore — Dedicated Metadata Service
  # ---------------------------------------------------------------------------
  hive-metastore-presto:
    image: apache/hive:3.1.3
    container_name: hive-metastore-presto
    hostname: hive-metastore-presto
    platform: linux/amd64
    depends_on:
      metastore-db-presto:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      # Note: We use the mounted JARs for the DB connection
    volumes:
      - ./hive-metastore/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./hive-metastore/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./gcs-key.json:/opt/hive/conf/gcs-key.json:ro
      - ./hive-metastore/postgresql-42.7.2.jar:/opt/hive/lib/postgresql-42.7.2.jar:ro
      - ./hive-metastore/gcs-connector-hadoop3-shaded.jar:/opt/hive/lib/gcs-connector-hadoop3-shaded.jar:ro
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - presto-network

  # ---------------------------------------------------------------------------
  # 3. Presto Coordinator (Java)
  # ---------------------------------------------------------------------------
  presto-coordinator:
    image: prestodb/presto:latest
    container_name: presto-coordinator
    hostname: presto-coordinator
    depends_on:
      hive-metastore-presto:
        condition: service_healthy
    volumes:
      - ./coordinator/etc:/opt/presto-server/etc:ro
      - ./gcs-key.json:/etc/presto/gcs-key.json:ro
      - ./hive-metastore/core-site.xml:/etc/presto/core-site.xml:ro
      - ./presto-spill:/tmp/presto-spill
    ports:
      - "8080:8080"
    networks:
      - presto-network

  # ---------------------------------------------------------------------------
  # 4. Presto Worker (Java)
  # ---------------------------------------------------------------------------
  presto-worker:
    image: prestodb/presto:latest
    container_name: presto-worker
    hostname: presto-worker
    depends_on:
      - presto-coordinator
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/presto/gcs-key.json
    volumes:
      - ./worker/etc:/opt/presto-server/etc:ro
      - ./gcs-key.json:/etc/presto/gcs-key.json:ro
      - ./hive-metastore/core-site.xml:/etc/presto/core-site.xml:ro
      - ./presto-spill:/tmp/presto-spill
    networks:
      - presto-network

  # ---------------------------------------------------------------------------
  # 5. MySQL — Metrics Storage for PBench
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    environment:
      - MYSQL_DATABASE=pbench
      - MYSQL_USER=pbench
      - MYSQL_PASSWORD=pbench_password
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "3307:3306"
    networks:
      - presto-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 6. Grafana — Visualization Dashboard
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - presto-network

volumes:
  metastore-db-data-presto:
  mysql-data:

networks:
  presto-network:
    driver: bridge


