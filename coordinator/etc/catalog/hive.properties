# =============================================================================
# Hive Catalog — Coordinator
# =============================================================================
# The Hive connector lets Presto read/write tables registered in the Hive
# Metastore. We use it as the "raw layer" to map external files (CSV/text)
# on GCS before migrating them to Iceberg.
# =============================================================================
connector.name=hive-hadoop2
hive.metastore.uri=thrift://hive-metastore-presto:9083
hive.config.resources=/etc/presto/core-site.xml
hive.gcs.json-key-file-path=/etc/presto/gcs-key.json
hive.allow-drop-table=true
hive.allow-rename-table=true
hive.allow-add-column=true
hive.allow-drop-column=true
