# =============================================================================
# Iceberg Catalog — Coordinator
# =============================================================================
# Apache Iceberg provides ACID transactions, schema evolution, time-travel,
# and hidden partitioning on top of Parquet/ORC files. This is the "gold layer"
# where our optimized benchmark data lives.
#
# Key settings:
#   - iceberg.file-format=PARQUET: Columnar format optimized for analytics.
#   - iceberg.max-partitions-per-writer=5000: Prevents metadata explosion
#     on highly partitioned tables.
# =============================================================================
connector.name=iceberg
hive.metastore.uri=thrift://hive-metastore-presto:9083
hive.config.resources=/etc/presto/core-site.xml
hive.gcs.json-key-file-path=/etc/presto/gcs-key.json
iceberg.file-format=PARQUET
iceberg.max-partitions-per-writer=5000
